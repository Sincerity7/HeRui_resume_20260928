const ALL = RAW.trim().split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
  const p = l.split("|");
  return { w:(p[0]||"").trim(), ipa:(p[1]||"").trim(), m:(p[2]||"").trim() };
});
const IDX = new Map(ALL.map(x=>[x.w,x]));
const DAY = 86400000;
const LS_KEY = "cet4_study_v1";

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
function todayKey(d){ const x = d?new Date(d):new Date(); return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); }
function fmtDate(ts){ const d = new Date(ts); return (d.getMonth()+1)+"月"+d.getDate()+"日"; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const POS_RE = /^(n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int|aux|abbr)\s*\.?\s*/i;
const stripPos = s => s.replace(POS_RE,"").trim();
const normEn = s => (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const normZh = s => (s||"").replace(/[\s,.，。；;：:、/\\()（）\-—'"“”‘’]/g,"");

function zhParts(m){
  return m.split(/[；;，,、/|]/).map(stripPos).map(normZh).filter(x=>x.length>0);
}
function judgeZh(input, meaning){
  const inp = normZh(input);
  if(!inp) return false;
  const parts = zhParts(meaning);
  if(!parts.length) return false;
  return parts.some(p => p === inp || (inp.length>=2 && p.includes(inp)) || (p.length>=2 && inp.includes(p)));
}
function judgeEn(input, word){
  const inp = normEn(input);
  return !!inp && inp === normEn(word);
}
function speak(w){
  if(!w || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(w);
    u.lang = "en-US"; u.rate = .88;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= 状态 ================= */
function defaultState(){
  return { goal:20, words:{}, plans:{}, mode:"c2e", totals:{right:0,wrong:0}, created:Date.now() };
}
let S = (function(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){ return defaultState(); }
})();
function save(){
  try{
    const keys = Object.keys(S.plans).sort();
    if(keys.length > 120){ keys.slice(0, keys.length-120).forEach(k=>delete S.plans[k]); }
    localStorage.setItem(LS_KEY, JSON.stringify(S));
  }catch(e){}
}
const learnedCount = () => Object.keys(S.words).length;
const learnedList  = () => Object.keys(S.words);

/* ================= 计划 ================= */
function ensurePlan(){
  const k = todayKey();
  if(!S.plans[k]){
    S.plans[k] = ALL.filter(x=>!S.words[x.w]).slice(0,S.goal).map(x=>x.w);
    save();
  }
  return S.plans[k];
}
function rebuildPlan(){
  const k = todayKey();
  const old = S.plans[k] || [];
  const done = old.filter(w=>S.words[w]);
  let pend = old.filter(w=>!S.words[w]);
  const need = Math.max(0, S.goal - done.length);
  if(pend.length > need){ pend = pend.slice(0, need); }
  else if(pend.length < need){
    const used = new Set(done.concat(pend).concat(Object.keys(S.words)));
    const rest = ALL.map(x=>x.w).filter(w=>!used.has(w));
    pend = pend.concat(rest.slice(0, need - pend.length));
  }
  S.plans[k] = done.concat(pend);
  save();
}

/* ================= 复习调度（简易间隔重复） ================= */
const INTERVALS = [0,1,2,4,7,15,30,60]; // 天，索引 = stage
function markLearned(w, fuzzy){
  const t = Date.now();
  const st = S.words[w] || { stage:1, right:0, wrong:0, seen:0, learnedAt:t };
  st.stage = 1;
  st.learnedAt = st.learnedAt || t;
  st.seen = (st.seen||0) + 1;
  st.lastSeen = t;
  st.next = t + (fuzzy ? 10*60*1000 : DAY);
  S.words[w] = st;
  save();
}
function grade(w, ok){
  const t = Date.now();
  const st = S.words[w] || { stage:1, right:0, wrong:0, seen:0, learnedAt:t };
  st.seen = (st.seen||0) + 1;
  st.lastSeen = t;
  if(ok){
    st.right = (st.right||0) + 1;
    st.stage = Math.min(7, (st.stage||1) + 1);
    st.next = t + INTERVALS[st.stage] * DAY;
    if(st.wrong > 0) st.wrong--;
  }else{
    st.wrong = (st.wrong||0) + 1;
    st.stage = Math.max(1, (st.stage||1) - 1);
    st.next = t + 10*60*1000;
  }
  S.words[w] = st;
  S.totals[ok?"right":"wrong"] = (S.totals[ok?"right":"wrong"]||0) + 1;
  save();
}
function dueList(){
  const now = Date.now();
  return learnedList().filter(w => (S.words[w].next||0) <= now)
    .sort((a,b)=>(S.words[a].next||0)-(S.words[b].next||0));
}
const dueCount = () => dueList().length;

/* ================= 顶部统计 ================= */
function renderStats(){
  const total = ALL.length, learned = learnedCount();
  const left = total - learned;
  const goal = S.goal || 20;
  const days = left <= 0 ? 0 : Math.ceil(left / goal);
  $("s-total").textContent = total;
  $("s-learned").textContent = learned;
  $("s-left").textContent = left;
  $("s-days").innerHTML = days + '<span class="u">天</span>';
  const pct = total ? (learned/total*100) : 0;
  $("progbar").style.width = pct.toFixed(2) + "%";
  $("progtext").textContent = "学习进度 " + pct.toFixed(1) + "%";
  if(left <= 0){
    $("etatext").textContent = "🎉 全部单词已学完，继续保持复习";
    $("setuphint").textContent = "按每天 " + goal + " 个，已无新词";
  }else{
    const eta = todayKey(Date.now() + days*DAY);
    $("etatext").textContent = "按每天 " + goal + " 个，预计 " + days + " 天后（" + eta.slice(5).replace("-","月") + "日）背完";
    $("setuphint").textContent = "剩余 " + left + " 词 ÷ 每天 " + goal + " 词 ≈ " + days + " 天";
  }
  $("goal").value = goal;
  document.querySelectorAll(".chip[data-g]").forEach(c=>c.classList.toggle("on", +c.dataset.g === goal));
}

/* ================= 今日背诵 ================= */
function renderToday(){
  const plan = ensurePlan();
  const doneList = plan.filter(w=>S.words[w]);
  const todo = plan.filter(w=>!S.words[w]);
  const k = todayKey();
  $("today-title").textContent = "今日背诵清单 · " + k.slice(5).replace("-","月") + "日";
  $("today-sub").textContent = "已完成 " + doneList.length + " / " + plan.length + " 个（未完成部分会顺延到明天）";

  const box = $("today-list");
  if(!plan.length){
    box.innerHTML = '<div class="empty"><div class="big">✓</div><p>词库里所有单词都已经学过了。<br>去「复习默写」巩固一遍吧。</p><button class="btn primary" data-go="review">前往复习</button></div>';
    return;
  }
  const order = todo.concat(doneList);
  box.innerHTML = order.map(w=>{
    const it = IDX.get(w);
    const st = S.words[w];
    let badge = '<span class="badge new">待背诵</span>', cls = "", body = "";
    if(st){
      cls = "done";
      badge = (st.stage && st.stage >= 3)
        ? '<span class="badge learned">已熟练掌握</span>'
        : '<span class="badge learned">已学习</span>';
      body = '<div class="meaning">'+esc(it.m)+'</div>';
    }else{
      body = '<div class="mhint" data-act="reveal">点击查看中文释义</div>'
           + '<div class="meaning hidden">'+esc(it.m)+'</div>'
           + '<div class="acts"><button class="btn small" data-act="reveal">显示释义</button>'
           + '<button class="btn small good" data-act="know">记住了</button>'
           + '<button class="btn small warn" data-act="fuzzy">不太熟</button></div>';
    }
    return '<div class="wcard '+cls+'" data-w="'+esc(w)+'">'
      + '<div class="wrow"><div class="wl"><span class="word">'+esc(it.w)+'</span><span class="ipa">/'+esc(it.ipa)+'/</span></div>'
      + '<div class="wr">'+badge+'<button class="icon" data-act="speak" title="朗读">🔊</button></div></div>'
      + body + '</div>';
  }).join("");
}

/* ================= 复习 ================= */
let R = null;
function buildRoundQueue(){
  const due = dueList();
  let q = due.slice(0, 25);
  if(q.length < 10){
    const extra = shuffle(learnedList().filter(w=>q.indexOf(w)<0));
    q = q.concat(extra.slice(0, 12 - q.length));
  }
  return q;
}
function startRound(){
  const q = buildRoundQueue();
  if(!q.length){ R = null; renderReview(); return; }
  R = { q, i:0, right:0, wrong:0, done:0, locked:false, revealed:false, current:null, userAns:"", lastOk:null, finished:false, extra:0 };
  const c = q[0];
  R.current = c;
  renderReview();
  focusInput();
}
function focusInput(){ const el = $("qInput"); if(el) setTimeout(()=>el.focus(), 40); }

function renderQuestionRounds(){
  const body = $("review-body");
  if(!R || R.finished){
    if(!R) return;
    const n = R.right + R.wrong;
    const rate = n ? Math.round(R.right/n*100) : 0;
    body.innerHTML = '<div class="qcard donebox"><div class="big">🕯️</div>'
      + '<h3>本轮复习结束</h3>'
      + '<div class="sc">共作答 <b>'+n+'</b> 题<br>答对 '+R.right+' 题 · 答错 '+R.wrong+' 题 · 正确率 '+rate+'%</div>'
      + '<div class="qacts"><button class="btn primary" data-act="again">再来一轮</button>'
      + '<button class="btn" data-act="totoday">去背今天的新词</button></div></div>';
    return;
  }
  const w = R.current, it = IDX.get(w);
  const c2e = S.mode === "c2e";
  const prompt = c2e
    ? '<div class="qhint">看中文，写出对应的英文单词</div><div class="qprompt zh">'+esc(it.m)+'</div>'
    : '<div class="qhint">看英文，写出中文意思</div><div class="qprompt">'+esc(it.w)+'</div><div class="qi">/'+esc(it.ipa)+'/</div>';

  body.innerHTML = '<div class="qcard">'
    + prompt
    + (c2e ? '' : '<div style="margin-top:6px"><button class="icon" data-act="speak" style="margin:0 auto">🔊</button></div>')
    + '<input class="q" id="qInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="'
      + (c2e ? "输入英文单词…" : "输入中文意思…") + '"'
      + (R.locked ? " disabled" : "") + ' value="'+esc(R.userAns)+'">'
    + '<div class="qacts">'
      + (R.locked ? "" : '<button class="btn primary" data-act="submit">提交答案</button><button class="btn" data-act="reveal">查看答案</button>')
      + (R.locked ? '<button class="btn primary" data-act="next">下一个 →</button>' : "")
    + '</div>'
    + '<div class="fb'+(R.locked?" show "+(R.lastOk?"ok":"no"):"")+'" id="qFb">'+feedbackHtml()+'</div>'
    + '</div>';
  updateReviewMeta();
}
function feedbackHtml(){
  if(!R || !R.locked) return "";
  const w = R.current, it = IDX.get(w);
  const need = S.mode === "c2e" ? it.w : it.m;
  let h = R.lastOk ? "✓ 答对了" : "✗ 答错了";
  let s = "";
  if(!R.lastOk){
    s += '<div class="you">你的答案：' + (R.userAns.trim() ? esc(R.userAns) : "（未作答）") + '</div>';
  }
  s += '<div style="margin-top:6px">正确答案：<b>' + esc(need) + '</b></div>';
  if(S.mode === "e2c") s += '<div class="you" style="margin-top:4px">'+esc(it.w)+' /'+esc(it.ipa)+'/</div>';
  else s += '<div class="you" style="margin-top:4px">释义：'+esc(it.m)+'</div>';
  s += '<div class="fix">'
    + '<button class="btn small" data-act="fix">'+(R.lastOk?"其实我答错了":"其实我答对了")+'</button>'
    + '<button class="btn small primary" data-act="next">下一个 →</button></div>';
  return '<div style="font-size:16px;margin-bottom:6px">'+h+'</div>' + s;
}
function updateReviewMeta(){
  const due = dueCount(), total = S.totals.right + S.totals.wrong;
  const acc = total ? Math.round(S.totals.right/total*100) : 0;
  $("review-sub").textContent = due > 0
    ? "有 " + due + " 个单词到期需要复习"
    : "暂无到期单词，本轮为自由复习（从已学词中抽取）";
  $("review-meta").innerHTML = R
    ? '第 ' + Math.min(R.i+1, R.q.length) + ' / ' + R.q.length + ' 题 · <em>对 ' + R.right + '</em> · <s>错 ' + R.wrong + '</s> · 累计正确率 ' + acc + '%'
    : (total ? '累计作答 ' + total + ' 题 · 正确率 ' + acc + '%' : '');
}
function renderReview(){
  const body = $("review-body");
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on", b.dataset.mode === S.mode));
  if(!learnedList().length){
    R = null;
    body.innerHTML = '<div class="empty"><div class="big">🕯</div><p>还没有学过任何单词。<br>先去「今日背诵」把今天的新词过一遍，再来默写检查。</p><button class="btn primary" data-act="totoday">去背今天的新词</button></div>';
    updateReviewMeta();
    return;
  }
  if(!R){ startRound(); return; }
  renderQuestionRounds();
  if(R && !R.finished) updateReviewMeta();
}
function submitAnswer(){
  if(!R || !R.current || R.locked) return;
  const el = $("qInput");
  const val = el ? el.value : "";
  if(!val.trim()){
    if(el){ el.classList.add("shake"); setTimeout(()=>el.classList.remove("shake"), 380); }
    return;
  }
  R.userAns = val;
  const w = R.current, it = IDX.get(w);
  const ok = S.mode === "c2e" ? judgeEn(val, w) : judgeZh(val, it.m);
  finishQuestion(ok);
}
function revealAnswer(){
  if(!R || !R.current || R.locked) return;
  const el = $("qInput");
  R.userAns = el ? el.value : "";
  finishQuestion(false);
}
function finishQuestion(ok){
  const w = R.current;
  R.locked = true;
  R.lastOk = ok;
  R.done++;
  if(ok) R.right++; else R.wrong++;
  grade(w, ok);
  if(!ok && R.q.length < 40 && R.done < 55){
    R.q.push(w); R.extra++;
  }
  renderQuestionRounds();
  const fb = $("qFb");
  if(fb) fb.scrollIntoView({ block:"nearest", behavior:"smooth" });
}
function flipVerdict(){
  if(!R || !R.locked) return;
  const wasOk = R.lastOk;
  const w = R.current;
  R.lastOk = !wasOk;
  if(wasOk){ R.right--; R.wrong++; grade(w, false); }
  else{ R.wrong--; R.right++; grade(w, true); }
  renderQuestionRounds();
}
function advance(){
  if(!R) return;
  R.i++;
  if(R.i >= R.q.length || R.done >= 55){ R.finished = true; renderReview(); updateReviewMeta(); return; }
  R.current = R.q[R.i];
  R.locked = false; R.revealed = false; R.userAns = ""; R.lastOk = null;
  renderQuestionRounds();
  focusInput();
}

/* ================= 词库 ================= */
let libFilter = "all";
function renderLib(){
  const kw = ($("libSearch").value || "").trim().toLowerCase();
  const now = Date.now();
  const rows = ALL.filter(it=>{
    const st = S.words[it.w];
    if(libFilter === "new" && st) return false;
    if(libFilter === "learned" && !st) return false;
    if(libFilter === "due" && !(st && (st.next||0) <= now)) return false;
    if(kw && !(it.w.toLowerCase().indexOf(kw) >= 0 || it.m.toLowerCase().indexOf(kw) >= 0)) return false;
    return true;
  });
  $("lib-sub").textContent = "共 " + ALL.length + " 词，当前筛选 " + rows.length + " 词";
  $("libBox").innerHTML = rows.length ? rows.map(it=>{
    const st = S.words[it.w];
    let b = '<span class="badge">未学</span>';
    if(st){
      if((st.next||0) <= now) b = '<span class="badge due">待复习</span>';
      else if((st.stage||1) >= 3) b = '<span class="badge learned">熟练</span>';
      else b = '<span class="badge learned">已学</span>';
    }
    return '<div class="librow"><span class="lw">'+esc(it.w)+'</span>'
      + '<button class="speakmini" data-act="speak" data-w="'+esc(it.w)+'">🔊</button>'
      + '<span class="lm">'+esc(it.m)+'</span>'+b+'</div>';
  }).join("") : '<div style="padding:30px;text-align:center;color:var(--faint);font-size:14px">没有匹配的单词</div>';
}

/* ================= 视图切换 ================= */
let view = "today";
function switchView(v){
  view = v;
  ["today","review","lib"].forEach(x=>{
    $("view-"+x).classList.toggle("hidden", x !== v);
  });
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.view === v));
  if(v === "today") renderToday();
  if(v === "review") renderReview();
  if(v === "lib") renderLib();
}
function renderAll(){
  renderStats();
  if(view === "today") renderToday();
  if(view === "review") renderReview();
  if(view === "lib") renderLib();
}

/* ================= 事件 ================= */
document.addEventListener("click", function(e){
  const t = e.target.closest("[data-act],[data-go],[data-view],[data-g],[data-mode],[data-f]");
  if(!t) return;

  if(t.dataset.view){ switchView(t.dataset.view); return; }
  if(t.dataset.go){ switchView(t.dataset.go); return; }
  if(t.dataset.mode){ S.mode = t.dataset.mode; save(); renderReview(); return; }
  if(t.dataset.g){ S.goal = +t.dataset.g; save(); rebuildPlan(); renderStats(); renderToday(); return; }
  if(t.dataset.f){
    libFilter = t.dataset.f;
    document.querySelectorAll(".chip[data-f]").forEach(c=>c.classList.toggle("on", c === t));
    renderLib(); return;
  }

  const act = t.dataset.act;
  if(act === "speak"){
    const w = t.dataset.w || (t.closest("[data-w]") ? t.closest("[data-w]").dataset.w : (R && R.current));
    speak(w); return;
  }
  if(act === "submit"){ submitAnswer(); return; }
  if(act === "reveal"){
    if($("qInput")){ revealAnswer(); return; }
    const card = t.closest(".wcard");
    if(card){
      const m = card.querySelector(".meaning");
      if(m) m.classList.remove("hidden");
      const h = card.querySelector(".mhint");
      if(h) h.remove();
      const b = card.querySelector('.btn[data-act="reveal"]');
      if(b) b.style.display = "none";
    }
    return;
  }
  if(act === "next"){ advance(); return; }
  if(act === "fix"){ flipVerdict(); return; }
  if(act === "again"){ startRound(); return; }
  if(act === "totoday"){ switchView("today"); return; }
  if(act === "know" || act === "fuzzy"){
    const card = t.closest(".wcard");
    if(card){ markLearned(card.dataset.w, act === "fuzzy"); renderStats(); renderToday(); }
    return;
  }
});

document.addEventListener("keydown", function(e){
  if(view !== "review" || !R) return;
  if(e.key === "Enter"){
    e.preventDefault();
    if(R.locked) advance(); else submitAnswer();
  }
});
$("goal").addEventListener("change", function(){
  let v = parseInt(this.value, 10);
  if(isNaN(v) || v < 1) v = 1;
  if(v > 500) v = 500;
  S.goal = v; save(); rebuildPlan(); renderStats(); renderToday();
});
$("libSearch").addEventListener("input", renderLib);
$("resetBtn").addEventListener("click", function(){
  if(!confirm("确定要清空全部学习进度吗？\n已学记录、复习计划和统计数据都会删除，且无法恢复。")) return;
  S = defaultState(); save(); R = null;
  renderAll();
});
$("today-list").addEventListener("click", function(e){
  // 兼容旧版模糊样式（保留无害）
  const m = e.target.closest(".meaning.hide");
  if(m){ m.classList.remove("hide"); }
});
// 顶部统计每天自动刷新一次计划
setInterval(function(){ renderStats(); }, 60000);

/* ================= 启动 ================= */
ensurePlan();
renderAll();
</script>
